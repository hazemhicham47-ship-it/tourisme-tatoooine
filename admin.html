<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المستندات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- نافذة تسجيل الدخول بكلمة المرور -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-75 flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96 text-center">
            <h2 class="text-xl font-bold mb-4 text-gray-800"><i class="fas fa-lock text-yellow-500 ml-2"></i>تسجيل دخول الأدمن</h2>
            <p class="text-sm text-gray-600 mb-4">يرجى إدخال كلمة المرور للوصول للوحة التحكم وإدارة المستندات.</p>
            <input type="password" id="adminPasswordInput" placeholder="أدخل كلمة المرور" class="w-full border border-gray-300 p-2 rounded mb-4 text-center focus:outline-none focus:border-blue-500">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition font-bold">دخول</button>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden"></p>
        </div>
    </div>

    <!-- المحتوى الرئيسي للوحة التحكم -->
    <div id="adminContent" class="hidden min-h-screen">
        <!-- الهيدر -->
        <header class="bg-slate-800 text-white p-4 shadow-md">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold"><i class="fas fa-user-shield ml-2"></i>لوحة تحكم إدارة المستندات والوثائق</h1>
                <div class="flex items-center space-x-4 space-x-reverse">
                    <a href="investor.html" target="_blank" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-sm"><i class="fas fa-eye ml-1"></i>معاينة بوابة المستثمر</a>
                    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-sm"><i class="fas fa-sign-out-alt ml-1"></i>خروج</button>
                </div>
            </div>
        </header>

        <main class="container mx-auto p-4 md:p-6">
            <!-- نموذج إضافة/تعديل وثيقة -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <h2 id="formTitle" class="text-lg font-bold mb-4 text-slate-700 border-b pb-2"><i class="fas fa-plus-circle ml-2"></i>إضافة وثيقة جديدة</h2>
                <form id="documentForm" onsubmit="saveDocument(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="docId">
                    
                    <div>
                        <label class="block text-sm font-medium mb-1">عنوان الوثيقة/المستند</label>
                        <input type="text" id="title" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">القسم / التصنيف</label>
                        <input type="text" id="category" required placeholder="مثال: تراخيص، دراسة جدوى..." class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">حالة المستند</label>
                        <select id="status" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="مقبول">مقبول</option>
                            <option value="قيد المراجعة">قيد المراجعة</option>
                            <option value="مرفوض">مرفوض</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">رابط الملف (URL)</label>
                        <input type="url" id="fileUrl" placeholder="https://..." class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div class="flex items-center space-x-2 space-x-reverse md:col-span-2 my-2">
                        <input type="checkbox" id="urgent" class="w-4 h-4 text-red-600 rounded">
                        <label for="urgent" class="text-sm font-medium text-red-600">تعليم كـ "طلب عاجل / تذكير هام"</label>
                    </div>

                    <div class="md:col-span-2 flex space-x-2 space-x-reverse">
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-bold transition"><i class="fas fa-save ml-1"></i>حفظ البيانات</button>
                        <button type="button" onclick="resetForm()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded transition">إلغاء</button>
                    </div>
                </form>
            </div>

            <!-- جدول عرض المستندات -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                    <h3 class="font-bold text-slate-700"><i class="fas fa-list ml-2"></i>قائمة المستندات المرفوعة</h3>
                    <button onclick="fetchDocuments()" class="text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded"><i class="fas fa-sync-alt ml-1"></i>تحديث</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b text-sm text-slate-600">
                                <th class="p-3">العنوان</th>
                                <th class="p-3">القسم</th>
                                <th class="p-3">الحالة</th>
                                <th class="p-3">عاجل</th>
                                <th class="p-3">الرابط</th>
                                <th class="p-3 text-center">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="documentsTable" class="divide-y text-sm">
                            <!-- سيتم إدراج البيانات هنا بواسطة JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://tourisme-tatoooine.onrender.com/api';

        // التأكد من تسجيل الدخول عند تحميل الصفحة
        window.onload = () => {
            const token = localStorage.getItem('adminToken');
            if (token === "admin-auth-secret-token") {
                showAdminPanel();
            }
        };

        async function handleLogin() {
            const password = document.getElementById('adminPasswordInput').value;
            const errorElement = document.getElementById('loginError');
            errorElement.classList.add('hidden');

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    showAdminPanel();
                } else {
                    errorElement.innerText = data.message || "كلمة المرور غير صحيحة";
                    errorElement.classList.remove('hidden');
                }
            } catch (err) {
                errorElement.innerText = "تعذر الاتصال بالسيرفر. تأكد من تشغيل السيرفر.";
                errorElement.classList.remove('hidden');
            }
        }

        function showAdminPanel() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            fetchDocuments();
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        // جلب المستندات
        async function fetchDocuments() {
            try {
                const res = await fetch(`${API_URL}/documents`);
                const docs = await res.json();
                renderTable(docs);
            } catch (err) {
                alert('خطأ في جلب المستندات');
            }
        }

        // عرض جدول المستندات
        function renderTable(docs) {
            const tbody = document.getElementById('documentsTable');
            tbody.innerHTML = '';

            docs.forEach(doc => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-3 font-semibold">${doc.title}</td>
                    <td class="p-3">${doc.category}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs ${getStatusClass(doc.status)}">${doc.status}</span></td>
                    <td class="p-3">${doc.urgent ? '🚨 نعم' : 'لا'}</td>
                    <td class="p-3">${doc.fileUrl ? `<a href="${doc.fileUrl}" target="_blank" class="text-blue-600 hover:underline"><i class="fas fa-external-link-alt"></i></a>` : '-'}</td>
                    <td class="p-3 text-center space-x-2 space-x-reverse">
                        <button onclick='editDocument(${JSON.stringify(doc)})' class="text-blue-600 hover:text-blue-800 font-medium"><i class="fas fa-edit ml-1"></i>تعديل</button>
                        <button onclick="deleteDocument('${doc._id}')" class="text-red-600 hover:text-red-800 font-medium"><i class="fas fa-trash ml-1"></i>حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getStatusClass(status) {
            if (status === 'مقبول') return 'bg-green-100 text-green-800';
            if (status === 'قيد المراجعة') return 'bg-yellow-100 text-yellow-800';
            return 'bg-red-100 text-red-800';
        }

        // حفظ / تعديل مستند (يتضمن Authorization Header)
        async function saveDocument(e) {
            e.preventDefault();
            const id = document.getElementById('docId').value;
            const docData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                status: document.getElementById('status').value,
                fileUrl: document.getElementById('fileUrl').value,
                urgent: document.getElementById('urgent').checked
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/documents/${id}` : `${API_URL}/documents`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': localStorage.getItem('adminToken')
                    },
                    body: JSON.stringify(docData)
                });

                if (res.ok) {
                    resetForm();
                    fetchDocuments();
                } else {
                    const err = await res.json();
                    alert(err.error || 'فشلت العملية');
                }
            } catch (err) {
                alert('خطأ في الاتصال بالسيرفر');
            }
        }

        function editDocument(doc) {
            document.getElementById('docId').value = doc._id;
            document.getElementById('title').value = doc.title;
            document.getElementById('category').value = doc.category;
            document.getElementById('status').value = doc.status;
            document.getElementById('fileUrl').value = doc.fileUrl || '';
            document.getElementById('urgent').checked = doc.urgent;
            document.getElementById('formTitle').innerText = 'تعديل وثيقة';
        }

        function resetForm() {
            document.getElementById('documentForm').reset();
            document.getElementById('docId').value = '';
            document.getElementById('formTitle').innerText = 'إضافة وثيقة جديدة';
        }

        // حذف مستند
        async function deleteDocument(id) {
            if (!confirm('هل أنت تأكد من حذف هذه الوثيقة؟')) return;

            try {
                const res = await fetch(`${API_URL}/documents/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': localStorage.getItem('adminToken')
                    }
                });

                if (res.ok) {
                    fetchDocuments();
                } else {
                    const err = await res.json();
                    alert(err.error || 'فشلت عملية الحذف');
                }
            } catch (err) {
                alert('خطأ في الاتصال بالسيرفر');
            }
        }
    </script>
</body>
</html>
